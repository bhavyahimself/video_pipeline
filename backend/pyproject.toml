[project]
name = "clipengine"
version = "0.1.0"
description = "AI-powered YouTube Shorts production platform"
authors = [{name = "ClipEngine Team"}]
requires-python = ">=3.11"

dependencies = [
    # API Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Redis
    "redis>=5.0.1",
    "aioredis>=2.0.1",

    # Task Queue
    "celery[redis]>=5.3.6",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "authlib>=1.3.0",
    "httpx>=0.26.0",

    # Payments
    "stripe>=7.12.0",

    # Storage
    "boto3>=1.34.0",

    # AI & ML (engine)
    "openai>=1.12.0",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.22",

    # YouTube
    "youtube-transcript-api>=0.6.1",
    "yt-dlp>=2024.1.0",
    "google-api-python-client>=2.116.0",
    "google-auth-oauthlib>=1.2.0",

    # Video Processing
    "moviepy>=1.0.3",
    "Pillow>=10.2.0",

    # Web & APIs
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "praw>=7.7.1",

    # Speech
    "openai-whisper>=20231117",

    # Web Automation
    "playwright>=1.41.0",

    # Data Visualization
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "tqdm>=4.66.0",
    "cryptography>=42.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "factory-boy>=3.3.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

