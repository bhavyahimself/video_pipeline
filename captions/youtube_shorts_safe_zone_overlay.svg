<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="none"/>

  <rect x="0" y="0" width="1080" height="170" fill="#4caf50" fill-opacity="0.12" stroke="#4caf50" stroke-width="4"/>
  <text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#4caf50">TOP LOW-RISK ZONE</text>

  <rect x="0" y="1460" width="1080" height="460" fill="#ff9800" fill-opacity="0.12" stroke="#ff9800" stroke-width="4"/>
  <text x="40" y="1540" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#ff9800">BOTTOM MODERATE-RISK ZONE</text>
  <text x="40" y="1595" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ff9800">Avoid stacking captions here. Shorts title, channel, and prompts can collide.</text>

  <rect x="860" y="250" width="220" height="1180" fill="#f44336" fill-opacity="0.12" stroke="#f44336" stroke-width="4"/>
  <text x="878" y="320" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#f44336">RIGHT UI RAIL</text>
  <text x="878" y="365" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f44336">Like</text>
  <text x="878" y="397" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f44336">Comment</text>
  <text x="878" y="429" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f44336">Share</text>

  <rect x="120" y="360" width="720" height="980" rx="24" fill="#00e5ff" fill-opacity="0.10" stroke="#00e5ff" stroke-width="6"/>
  <text x="540" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#00e5ff">PRIMARY SAFE CAPTION / LABEL BOX</text>
  <text x="540" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#00e5ff">Keep critical captions, labels, arrows, and payoff text inside this area.</text>

  <rect x="140" y="1010" width="680" height="220" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 14"/>
  <text x="480" y="1090" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#ffffff">RECOMMENDED CAPTION BAND</text>
  <text x="480" y="1140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff">1-2 short lines, bold, high contrast, emphasis only</text>

  <line x1="540" y1="0" x2="540" y2="1920" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="12 12"/>
  <line x1="0" y1="960" x2="1080" y2="960" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="12 12"/>

  <text x="40" y="1870" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#d7dde2">Internal Nature Unleashed overlay: center-weight the subject, avoid bottom-stack captions, avoid right-side UI rail.</text>
</svg>
